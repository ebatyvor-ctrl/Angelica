name: Build Angelica for Mobile (Snapdragon 865)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Angelica JAR
        run: ./gradlew assemble --no-daemon --no-configuration-cache --stacktrace -x test

      - name: Upload compiled Angelica JAR
        uses: actions/upload-artifact@v4
        with:
          name: angelica-mobileglues-snap865
          path: build/libs/*.jar
